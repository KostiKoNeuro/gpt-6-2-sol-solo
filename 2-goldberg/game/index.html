:root {
  color-scheme: light;
  --paper: #f7f2e8;
  --ink: #22263a;
  --muted: #55576a;
  --line: #c8c1b3;
  --purple: #5843c4;
  --deep-purple: #382c86;
  font-family: "DM Sans", "Segoe UI", sans-serif;
  font-synthesis: none;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 300px;
  min-height: 100svh;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 9% 1%, #fffaee 0, transparent 38%),
    radial-gradient(ellipse at 92% 94%, #eee8fc 0, transparent 42%),
    var(--paper);
}

button { font: inherit; }

.exhibit {
  width: min(calc(100% - clamp(28px, 7vw, 104px)), 1390px);
  margin-inline: auto;
  padding: 22px 0 16px;
}

.masthead, .introduction, .readout, .progress-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: .79rem;
  font-weight: 850;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
  border: 1px solid #d4a263;
  border-radius: 10px;
  background: #ffe2a3;
  box-shadow: 0 2px 0 #ebc488;
}

.brand-mark canvas { width: 31px; height: 31px; }

.sound {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 104px;
  min-height: 36px;
  padding: 5px 12px;
  background: #fffdf6;
  border: 1px solid var(--line);
  border-radius: 100px;
  color: var(--muted);
  font-size: .8rem;
  font-weight: 750;
  cursor: pointer;
}

.speaker { position: relative; width: 16px; height: 15px; }

.speaker::before {
  position: absolute;
  inset: 2px 5px 2px 0;
  background: currentColor;
  clip-path: polygon(0 30%, 35% 30%, 80% 0, 80% 100%, 35% 70%, 0 70%);
  content: "";
}

.speaker::after, .speaker i {
  position: absolute;
  border: 1.5px solid currentColor;
  border-block-color: transparent;
  border-inline-start-color: transparent;
  border-radius: 50%;
  content: "";
}

.speaker::after { width: 10px; height: 13px; top: 1px; left: 6px; }
.speaker i { width: 8px; height: 9px; top: 3px; left: 5px; }
.sound[aria-pressed="false"] .speaker i { display: none; }
.sound[aria-pressed="false"] .speaker::after {
  width: 8px;
  height: 2px;
  top: 7px;
  left: 8px;
  border: 0;
  border-radius: 1px;
  background: currentColor;
  transform: rotate(-45deg);
}

.introduction {
  align-items: end;
  gap: 24px;
  margin: 13px 0 18px;
}

h1, h2, p { margin: 0; }

h1 {
  font-family: "Bricolage Grotesque", "Arial Black", sans-serif;
  font-size: clamp(2.6rem, 5.15vw, 4.5rem);
  font-weight: 800;
  line-height: .99;
  letter-spacing: -.055em;
}

h1 span { color: var(--purple); }

.introduction p {
  margin-top: 10px;
  color: var(--muted);
  font-size: clamp(.94rem, 1.27vw, 1.12rem);
  line-height: 1.4;
}

.controls { display: flex; flex: 0 0 auto; gap: 10px; padding-block-end: 2px; }

.controls button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 51px;
  padding: 8px 19px;
  border: 1.5px solid var(--ink);
  border-radius: 11px;
  box-shadow: 0 3px 0 var(--ink);
  cursor: pointer;
  font-size: .99rem;
  font-weight: 850;
  transition: background-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
}

.controls .start {
  min-width: 125px;
  background-color: var(--purple);
  color: #fff;
}

.controls .reset { min-width: 105px; background: #fffdf6; color: var(--ink); }
.controls .start:hover:not(:disabled) { background: #4a34b3; }
.controls .reset:hover, .sound:hover { background: #f0e9ff; }
.controls button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.controls .start:disabled { background: #ece7f7; color: #4a4268; cursor: default; box-shadow: 0 2px 0 #a99ebc; border-color: #a99ebc; }
button:focus-visible { outline: 3px solid #8c64e7; outline-offset: 4px; }

.play-icon {
  width: 13px;
  height: 14px;
  background: currentColor;
  clip-path: polygon(6% 0, 100% 50%, 6% 100%);
}

.start:disabled .play-icon { width: 8px; height: 8px; border-radius: 50%; clip-path: none; background: #8c78bd; }

.reset-icon { position: relative; width: 14px; height: 14px; margin: 0 1px 0 0; }

.reset-icon::before, .reset-icon::after { position: absolute; content: ""; }

.reset-icon::before {
  inset: 1px;
  border: 1.65px solid currentColor;
  border-bottom-color: transparent;
  border-radius: 50%;
  transform: rotate(-32deg);
}

.reset-icon::after {
  top: 0;
  left: 0;
  width: 6px;
  height: 6px;
  border-left: 1.65px solid currentColor;
  border-bottom: 1.65px solid currentColor;
}

.machine {
  overflow: hidden;
  border: 1px solid #b5b0a4;
  border-radius: 18px;
  box-shadow: 0 4px 0 #e1d9c9, 0 14px 28px #4439630b;
  background: #f9f6ed;
}

.viewport {
  width: 100%;
  aspect-ratio: 1280 / 588;
  background: #faf7ec;
}

#board { display: block; width: 100%; height: 100%; }

.readout {
  gap: 26px;
  min-height: 68px;
  padding: 12px 19px;
  border-top: 1px solid #d0cabc;
  background: #fffdf7;
  transition: background-color 250ms ease;
}

.current-stage { display: flex; align-items: center; gap: 11px; }

.status-lamp {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #dcd2f2;
  background: #f0e9fd;
}

.status-lamp::before {
  width: 12px;
  height: 12px;
  margin-right: 3px;
  border-radius: 50%;
  box-shadow: 4px 2px 0 var(--purple);
  transform: rotate(17deg);
  content: "";
}

.machine[data-state="running"] .status-lamp::before {
  width: 11px;
  height: 13px;
  margin: 0;
  background: var(--purple);
  box-shadow: none;
  border-radius: 0;
  transform: none;
  clip-path: polygon(58% 0, 0 58%, 43% 58%, 37% 100%, 100% 36%, 55% 36%);
}

.machine[data-state="complete"] .readout { background: #fff8db; }
.machine[data-state="complete"] .status-lamp { background: #ffe7a2; border-color: #ebc770; }
.machine[data-state="complete"] .status-lamp::before {
  width: 17px;
  height: 17px;
  margin: 0;
  border-radius: 0;
  box-shadow: none;
  background: #a35124;
  transform: none;
  clip-path: polygon(50% 0, 63% 34%, 100% 50%, 63% 65%, 50% 100%, 36% 65%, 0 50%, 36% 34%);
}

.current-stage h2 { font-size: .99rem; font-weight: 850; line-height: 1.25; }
.current-stage p { margin-top: 2px; color: var(--muted); font-size: .82rem; line-height: 1.3; }
.progress { flex: 0 0 clamp(148px, 18.2vw, 234px); }
.progress-label { margin-bottom: 5px; color: var(--muted); font-size: .73rem; font-weight: 780; }
.stage-count { font-variant-numeric: tabular-nums; font-weight: 850; color: var(--ink); }
.progress-steps { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.progress-steps span { height: 6px; border-radius: 3px; background: #e8e2d7; }
.progress-steps span[data-done] { background-color: var(--stage-color); }
.progress-steps span[aria-current="step"] { box-shadow: 0 0 0 1px #fffdf7, 0 0 0 2px var(--stage-color); }

@media (min-width: 900px) and (max-height: 850px) {
  .exhibit { width: min(calc(100% - 60px), max(840px, calc((100svh - 238px) * 2.17687)), 1390px); padding: 15px 0 12px; }
  .introduction { margin-top: 10px; margin-bottom: 15px; }
  h1 { font-size: clamp(2.8rem, 7.2vh, 4.2rem); }
  .introduction p { margin-top: 7px; }
  .readout { min-height: 60px; padding-block: 9px; }
}

@media (max-width: 850px) {
  .introduction { gap: 14px; }
  .controls button { min-height: 46px; padding-inline: 12px; font-size: .9rem; }
  .controls .start { min-width: 100px; }
  .controls .reset { min-width: 83px; }
}

@media (max-width: 660px) {
  .exhibit { padding-top: 16px; }
  .introduction { display: block; margin: 19px 0 17px; }
  h1 { max-width: 14ch; font-size: clamp(2.65rem, 9.9vw, 3.8rem); }
  .introduction p { margin-top: 9px; max-width: 32ch; }
  .controls { margin-top: 16px; }
  .controls .start { flex: 1; max-width: 200px; }
  .controls .reset { min-width: 97px; }
  .machine { border-radius: 14px; }
  .readout { display: block; padding: 12px; }
  .progress { margin-top: 11px; }
  .progress-label { margin-bottom: 5px; }
  .progress-steps { gap: 5px; }
}

@media (max-width: 660px) and (prefers-reduced-motion: no-preference) {
  .viewport { transition: aspect-ratio 260ms ease; }
  .machine[data-state="running"] .viewport,
  .machine[data-state="complete"] .viewport { aspect-ratio: 1.38; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

  </style>
</head>
<body>
  <main class="exhibit">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark"><canvas id="mark" width="72" height="72" aria-hidden="true"></canvas></div>
        <span>The Tinker Lab</span>
      </div>
      <button class="sound" id="sound" type="button" aria-label="Sound" aria-pressed="true">
        <span class="speaker" aria-hidden="true"><i></i></span>
        <span id="sound-label" aria-hidden="true">Sound on</span>
      </button>
    </header>

    <section class="introduction" aria-labelledby="title">
      <div>
        <h1 id="title">The <span>Wake-Up</span> Machine</h1>
        <p>An absurd alarm clock for one very sleepy hamster.</p>
      </div>
      <div class="controls">
        <button class="start" id="start" type="button">
          <span class="play-icon" aria-hidden="true"></span><span id="start-label">Start</span>
        </button>
        <button class="reset" id="reset" type="button">
          <span class="reset-icon" aria-hidden="true"></span>Reset
        </button>
      </div>
    </section>

    <section class="machine" id="machine" data-state="ready" aria-label="Interactive physics exhibit">
      <div class="viewport">
        <canvas id="board" role="img" aria-label="Three levels of ramps and mechanisms carry a marble's motion to the bell beside Pip's nap nook. The numbered parts light up in order as the chain runs."></canvas>
      </div>
      <div class="readout">
        <div class="current-stage">
          <div class="status-lamp" id="status-lamp" aria-hidden="true"></div>
          <div role="status" aria-live="polite" aria-atomic="true">
            <h2 id="status-title">Pip is asleep</h2>
            <p id="status-detail">Press Start to release the first marble.</p>
          </div>
        </div>
        <div class="progress">
          <div class="progress-label">
            <span>Chain progress</span>
            <span class="stage-count" id="stage-count" aria-hidden="true">0 / 9</span>
          </div>
          <div class="progress-steps" id="progress-steps" role="progressbar" aria-label="Chain progress" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"></div>
        </div>
      </div>
    </section>
    <noscript><p>Enable JavaScript to run the Wake-Up Machine.</p></noscript>
  </main>

  </script>
  <script>
"use strict";

const { Bodies, Body, Composite, Constraint, Engine, Events } = Matter;
const WIDTH = 1280;
const HEIGHT = 588;
const STEP = 1000 / 120;

function createMachine(reportStage, reportSound) {
  const engine = Engine.create({
    positionIterations: 10,
    velocityIterations: 8,
    constraintIterations: 4
  });
  engine.gravity.y = 1.25;
  const world = engine.world;
  const tracks = [];
  const marbles = [];
  const dominoes = [];
  const dominoStops = [];
  const baseMaterial = { friction: 0.055, frictionStatic: 0.08, restitution: 0.07 };
  const add = body => {
    Composite.add(world, body);
    return body;
  };
  const fixed = (x, y, width, height, options = {}) => {
    const material = { ...baseMaterial, ...options };
    const body = Bodies.rectangle(x, y, width, height, { ...material, isStatic: true });
    // Matter assigns default grip and bounce when a body is made static.
    body.friction = material.friction;
    body.frictionStatic = material.frictionStatic;
    body.restitution = material.restitution;
    return add(body);
  };
  const rail = (x1, y1, x2, y2, kind = "wood", options = {}) => {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const thickness = kind === "spring" ? 12 : 13;
    const body = fixed(
      (x1 + x2) / 2 - Math.sin(angle) * thickness / 2,
      (y1 + y2) / 2 + Math.cos(angle) * thickness / 2,
      Math.hypot(x2 - x1, y2 - y1), thickness, { angle, ...options }
    );
    tracks.push({ x1, y1, x2, y2, thickness, kind, body });
    return body;
  };
  const marble = (x, y, radius, mass, kind, options = {}) => {
    const body = Bodies.polygon(x, y, 36, radius, {
      ...baseMaterial, frictionAir: 0.0012, restitution: 0.12, ...options
    });
    Body.setMass(body, mass);
    Body.setInertia(body, 0.4 * mass * radius * radius);
    marbles.push({ body: add(body), radius, kind });
    return body;
  };
  const piece = (x, y, width, height, options = {}) =>
    Bodies.rectangle(x, y, width, height, { ...baseMaterial, ...options });
  const compound = (parts, options = {}) => add(Body.create({ parts, ...baseMaterial, ...options }));
  const pinJoint = (body, x, y, damping = 0.09) => {
    const point = { x: x - body.position.x, y: y - body.position.y };
    return add(Constraint.create({
      pointA: { x, y }, bodyB: body, pointB: point, length: 0, stiffness: 1, damping
    }));
  };

  // The starter pin is the only machine part moved by the controls.
  rail(62, 54, 351, 127, "violet");
  rail(343, 148, 653, 148, "wood", { friction: 0.85, frictionStatic: 1 });
  const releaseWall = fixed(56, 43, 12, 49, { angle: 0.18 });
  const releasePin = fixed(110, 51, 11, 36, { angle: 0.21 });
  const starter = marble(79, 39, 17, 1.5, "violet");

  for (let index = 0; index < 9; index += 1) {
    const x = 381 + index * 30;
    const body = piece(x, 121, 10, 48, {
      friction: 0.11, frictionStatic: 0.12, restitution: 0.1, frictionAir: 0.002
    });
    Body.setMass(body, 1.15);
    Body.setInertia(body, 1.15 * (10 ** 2 + 48 ** 2) / 12);
    Body.rotate(body, -0.035, { x, y: 142 });
    dominoes.push(add(body));
    pinJoint(body, x, 142, 0);
    dominoStops.push(fixed(x - 8, 131, 5, 10, { restitution: 0 }));
  }

  const freight = marble(651, 123.7, 24, 3.35, "coral", { restitution: 0.06 });
  rail(653, 154, 1103, 217, "coral");
  const dropWall = fixed(1181, 239, 13, 88, { restitution: 0.02 });

  // A falling load turns the seesaw. Its lower arm kicks the return marble.
  const bootPivot = { x: 1024, y: 281 };
  const seesaw = compound([
    piece(1024, 281, 276, 14),
    piece(913, 267, 39, 22, { density: 0.003, chamfer: { radius: 4 } }),
    piece(1109, 263, 11, 38, { angle: -0.22 }),
    piece(1154, 259, 12, 47, { angle: 0.2 }),
    piece(1001, 308, 14, 56, { angle: 0.3 }),
    piece(991, 338, 28, 21, { chamfer: { radius: 4 } })
  ], { frictionAir: 0.01, restitution: 0.12 });
  Body.setMass(seesaw, 3.1);
  pinJoint(seesaw, bootPivot.x, bootPivot.y, 0.04);
  const topStop = fixed(912, 294, 28, 12);
  const bottomStop = fixed(1140, 341, 38, 15);

  const returnBall = marble(955, 338, 17, 1.75, "teal", { restitution: 0.24 });
  rail(322, 415, 940, 360, "teal");
  rail(940, 360, 976, 360, "teal");
  const returnStop = fixed(979, 366, 10, 20);

  const wheelPivot = { x: 653, y: 311 };
  const wheel = compound([
    piece(653, 311, 70, 9),
    piece(653, 311, 9, 70),
    piece(689, 311, 18, 22, { chamfer: { radius: 4 } }),
    piece(653, 347, 22, 18, { chamfer: { radius: 4 } }),
    piece(617, 311, 18, 22, { chamfer: { radius: 4 } }),
    piece(653, 275, 22, 18, { chamfer: { radius: 4 } })
  ], { frictionAir: 0.009, restitution: 0.12 });
  Body.setMass(wheel, 0.56);
  pinJoint(wheel, wheelPivot.x, wheelPivot.y);

  const trampoline = rail(231, 456, 325, 429, "spring", {
    restitution: 0.91, friction: 0.005, frictionStatic: 0
  });

  // The bucket and gate are sliders joined by one inextensible cable.
  // Projection enforces equal and opposite travel while conserving impulse.
  const bucketX = 169;
  const gateX = 404;
  const bucket = compound([
    piece(bucketX, 495, 84, 10),
    piece(bucketX - 42, 476, 9, 50, { angle: -0.26 }),
    piece(bucketX + 42, 482, 9, 29, { angle: 0.24 })
  ], { frictionAir: 0.019, friction: 0.01, restitution: 0.03 });
  const gate = add(piece(gateX, 480, 16, 28, {
    frictionAir: 0.019, friction: 0.009, frictionStatic: 0.01
  }));
  Body.setMass(bucket, 0.62);
  Body.setMass(gate, 1.26);
  Body.setInertia(bucket, Infinity);
  Body.setInertia(gate, Infinity);
  const pulley = {
    bucket, gate, bucketX, gateX,
    bucketHome: bucket.position.y,
    gateHome: gate.position.y,
    axleY: 382,
    travel: 40
  };

  rail(354, 489, 917, 557, "yellow");
  const alarmStop = fixed(349, 474, 10, 35);
  const alarmBall = marble(381, 466, 16, 2.1, "yellow", { restitution: 0.15 });

  const strikerPivot = { x: 845, y: 461 };
  const clapper = marble(845, 529, 19, 0.85, "striker", { restitution: 0.18 });
  const strikerJoint = pinJoint(clapper, strikerPivot.x, strikerPivot.y);
  strikerJoint.pointB = { x: 0, y: 0 };
  strikerJoint.length = 68;
  const bellPivot = { x: 914, y: 472 };
  const bell = compound([
    piece(896, 507, 20, 56, { chamfer: { radius: 4 } }),
    piece(914, 502, 28, 51, { density: 0.0028, chamfer: { radius: 4 } })
  ], { restitution: 0.32, frictionAir: 0.04 });
  Body.setMass(bell, 2.8);
  pinJoint(bell, bellPivot.x, bellPivot.y);
  rail(910, 557, 948, 557, "yellow");
  fixed(952, 541, 11, 34, { restitution: 0.1 });
  fixed(WIDTH / 2, HEIGHT + 8, WIDTH, 18, { friction: 0.5, restitution: 0.02 });

  let started = false;
  let time = 0;
  const done = new Set();
  const tileContacts = new Set();
  const stage = number => {
    if (started && !done.has(number)) {
      done.add(number);
      reportStage(number, time);
    }
  };

  function solvePulley() {
    const { bucketHome, gateHome, travel } = pulley;
    const inverseTotal = bucket.inverseMass + gate.inverseMass;
    const bucketShare = bucket.inverseMass / inverseTotal;
    const lengthError = bucket.position.y - bucketHome + gate.position.y - gateHome;
    const position = bucket.position.y - bucketHome - lengthError * bucketShare;
    const travelY = Math.min(travel, Math.max(0, position));
    const ropeVelocity = bucket.velocity.y + gate.velocity.y;
    let velocity = bucket.velocity.y - ropeVelocity * bucketShare;
    if ((position <= 0 && velocity < 0) || (position >= travel && velocity > 0)) {
      velocity = 0;
    }
    Body.setPosition(bucket, { x: bucketX, y: bucketHome + travelY });
    Body.setPosition(gate, { x: gateX, y: gateHome - travelY });
    Body.setVelocity(bucket, { x: 0, y: velocity });
    Body.setVelocity(gate, { x: 0, y: -velocity });
  }

  // Stage reporting and audio observe contact and travel. They do not drive bodies.
  Events.on(engine, "collisionStart", event => {
    if (!started) return;
    for (const { bodyA, bodyB } of event.pairs) {
      const a = bodyA.parent;
      const b = bodyB.parent;
      const hits = (left, right) => (a === left && b === right) || (a === right && b === left);
      if (hits(starter, dominoes[0])) stage(2);
      if (hits(freight, seesaw)) stage(4);
      if (hits(returnBall, wheel)) stage(5);
      if (hits(returnBall, trampoline)) stage(6);
      if (hits(alarmBall, clapper)) stage(8);
      if (hits(clapper, bell)) stage(9);
      if (dominoes.includes(a) && dominoes.includes(b)) {
        const key = Math.min(a.id, b.id) + ":" + Math.max(a.id, b.id);
        if (!tileContacts.has(key)) {
          tileContacts.add(key);
          reportSound("tile");
        }
      }
    }
  });

  function step() {
    time += STEP / 1000;
    Engine.update(engine, STEP);
    solvePulley();
    if (freight.position.x > 665) stage(3);
    if (bucket.position.y - pulley.bucketHome > 5) stage(7);
  }

  // Quietly settle contact tolerances, then freeze the initial assembly.
  for (let frame = 0; frame < 150; frame += 1) step();
  time = 0;

  function start() {
    if (started) return;
    started = true;
    Composite.remove(world, releasePin);
    stage(1);
  }

  return {
    engine, tracks, marbles, dominoes, dominoStops, releasePin, releaseWall, bootPivot, seesaw, topStop,
    bottomStop, dropWall, returnStop, wheel, wheelPivot, pulley, strikerPivot,
    clapper, bell, bellPivot, alarmStop, starter, freight, returnBall, alarmBall, step, start,
    get started() { return started; },
    get time() { return time; }
  };
}

function drawBrand(canvas) {
  const brush = canvas.getContext("2d");
  brush.translate(36, 36);
  brush.fillStyle = "#634cb8";
  brush.beginPath();
  for (let tooth = 0; tooth < 40; tooth += 1) {
    const angle = tooth * Math.PI / 20 - Math.PI / 2;
    const radius = tooth % 4 < 2 ? 26 : 21;
    brush.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
  }
  brush.closePath();
  brush.fill();

  brush.fillStyle = "#fff6dc";
  for (const [x, y, r] of [[-10, -8, 6], [10, -8, 6], [0, 2, 14]]) {
    brush.beginPath();
    brush.arc(x, y, r, 0, Math.PI * 2);
    brush.fill();
  }
  brush.fillStyle = "#3c315f";
  for (const [x, y, r] of [[-5, 1, 1.9], [5, 1, 1.9], [0, 6, 1.8]]) {
    brush.beginPath();
    brush.arc(x, y, r, 0, Math.PI * 2);
    brush.fill();
  }
}

function createScene(canvas) {
  const TAU = Math.PI * 2;
  const INK = "#2e3044";
  const board = canvas.getContext("2d", { alpha: false });
  const backdrop = document.createElement("canvas");
  const pathCache = new Map();
  const smallScreen = matchMedia("(max-width: 660px)");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let ctx = board;
  let paintedMachine;
  let viewportWidth = WIDTH;
  let viewportHeight = HEIGHT;
  let pixelRatio = 1;
  let zoom = 0;
  let cameraX = WIDTH / 2;
  let cameraY = HEIGHT / 2;
  let particles = [];
  let festoon = [];

  function rounded(x, y, w, h, r, fill, stroke, weight = 1.7) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = weight;
      ctx.stroke();
    }
  }

  function oval(x, y, rx, ry, fill, stroke, weight = 1.7, angle = 0) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, angle, 0, TAU);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = weight;
      ctx.stroke();
    }
  }

  function disk(x, y, r, fill, stroke, weight) {
    oval(x, y, r, r, fill, stroke, weight);
  }

  function path(description, fill, stroke, weight = 1.7) {
    if (!pathCache.has(description)) pathCache.set(description, new Path2D(description));
    const shape = pathCache.get(description);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill(shape);
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = weight;
      ctx.stroke(shape);
    }
  }

  function line(points, color, weight = 1.7, dashed = []) {
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    for (const point of points.slice(1)) ctx.lineTo(...point);
    ctx.strokeStyle = color;
    ctx.lineWidth = weight;
    ctx.setLineDash(dashed);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function label(str, x, y, font, color = INK, align = "left") {
    ctx.font = font;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function hardware(x, y, r = 4, fill = "#fff1cf", edge = "#765f50") {
    disk(x, y + 0.85, r, "#30233221");
    disk(x, y, r, fill, edge, 1.15);
    line([[x - r * 0.41, y - r * 0.28], [x + r * 0.41, y + r * 0.28]], edge, 0.9);
  }

  function glint(x, y, size, color) {
    ctx.beginPath();
    ctx.moveTo(x, y - size);
    ctx.quadraticCurveTo(x + size * 0.17, y - size * 0.14, x + size * 0.75, y);
    ctx.quadraticCurveTo(x + size * 0.17, y + size * 0.14, x, y + size);
    ctx.quadraticCurveTo(x - size * 0.17, y + size * 0.14, x - size * 0.75, y);
    ctx.quadraticCurveTo(x - size * 0.17, y - size * 0.14, x, y - size);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function paper() {
    const wash = ctx.createLinearGradient(0, 0, WIDTH * 0.85, HEIGHT);
    wash.addColorStop(0, "#f6f2ff");
    wash.addColorStop(0.46, "#fbf8ef");
    wash.addColorStop(1, "#fdf2d8");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.beginPath();
    for (let x = 20; x < WIDTH; x += 20) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, HEIGHT);
    }
    for (let y = 20; y < HEIGHT; y += 20) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(WIDTH, y + 0.5);
    }
    ctx.strokeStyle = "#7c797b13";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    for (let x = 40; x < WIDTH; x += 80) {
      for (let y = 40; y < HEIGHT; y += 80) {
        ctx.moveTo(x - 2.3, y);
        ctx.lineTo(x + 2.3, y);
        ctx.moveTo(x, y - 2.3);
        ctx.lineTo(x, y + 2.3);
      }
    }
    ctx.strokeStyle = "#7c797b30";
    ctx.stroke();

    ctx.fillStyle = "#d3b67b24";
    ctx.fillRect(0, 569, WIDTH, HEIGHT - 569);
    line([[0, 570], [WIDTH, 570]], "#b69f7d61", 1.1);
    for (const [x, y] of [[15, 15], [1265, 15], [15, 573], [1265, 573]]) {
      hardware(x, y, 3.2, "#fffaf1", "#a59c93");
    }
  }

  function bracket(x, y, dx, dy, material = "wood", tilt = 0) {
    const paint = PAINT[material];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(Math.sign(dx), Math.sign(dy));
    const w = Math.abs(dx);
    const h = Math.abs(dy);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fillStyle = paint.top;
    ctx.strokeStyle = paint.edge;
    ctx.lineWidth = 1.5;
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(8, 8);
    ctx.lineTo(w - (10 + w * 0.08), 8);
    ctx.lineTo(8, h - (10 + h * 0.08));
    ctx.closePath();
    ctx.fillStyle = "#fffdf08c";
    ctx.strokeStyle = "#ffffff8c";
    ctx.fill();
    ctx.stroke();
    hardware(4, Math.max(12, h - 13), 2.5, paint.light, paint.edge);
    ctx.restore();
  }

  function spring(x, y, height) {
    const points = [[x, y]];
    for (let turn = 1; turn < 8; turn += 1) {
      points.push([x + (turn % 2 ? 7 : -7), y + turn * height / 8]);
    }
    points.push([x, y + height]);
    line(points, "#805783", 4.6);
    line(points.map(([sx, sy]) => [sx - 0.9, sy - 0.6]), "#e5c3f1", 1.9);
    rounded(x - 11, y + height - 2, 22, 5, 2, "#c7b6d9", "#805783", 1.15);
  }

  function drawScaffolding(machine) {
    bracket(66, 68, 106, 59, "violet", 0.247);
    bracket(305, 128, -64, 44, "violet", 0.247);
    bracket(408, 161, 57, 43);
    bracket(590, 161, -57, 43);
    bracket(815, 189, -58, 42, "coral", 0.139);
    bracket(1049, 222, -59, 38, "coral", 0.139);
    bracket(491, 413, 58, 39, "teal", -0.089);
    bracket(838, 382, -51, 37, "teal", -0.089);
    bracket(465, 515, 52, 37, "yellow", 0.12);
    bracket(735, 548, -49, 30, "yellow", 0.12);
    spring(251, 453, 25);
    spring(306, 437, 32);

    // A wall plate and gusset hold the boot lever's fixed axle.
    rounded(1004, 261, 40, 57, 9, "#d8cce7", "#9c8ab2", 1.5);
    hardware(1013, 307, 3);
    hardware(1036, 307, 3);
    bracket(1024, 285, 31, 35, "steel");

    // Bench-mounted striker and bell hang from the same metal bracket.
    rounded(833, 449, 120, 13, 6, "#98abb0", "#566473");
    rounded(834, 449, 117, 4, 2, "#dce1db");
    hardware(849, 455, 3.3, "#e8ece4", "#60717a");
    hardware(943, 455, 3.3, "#e8ece4", "#60717a");
    bracket(950, 463, -31, 32, "steel");

    // The pulley sliders move along these stationary guides.
    const { bucketX, gateX, axleY } = machine.pulley;
    rounded(bucketX - 12, axleY - 7, gateX - bucketX + 27, 14, 6, "#dad1c0", "#a79984", 1.4);
    rounded(bucketX - 7, 407, 13, 137, 5, "#dad2c0", "#a99a88", 1.4);
    rounded(gateX - 8, 416, 16, 79, 5, "#dad2c0", "#a99a88", 1.4);
    for (const y of [419, 536]) hardware(bucketX, y, 2.8);
    for (const y of [423, 484]) hardware(gateX, y, 2.8);

    path("M1128 209 Q1149 216 1159 236", null, "#ac7360", 1.7);
    line([[1152, 232], [1159, 237], [1161, 228]], "#ac7360", 1.7);

    // Inset pin hardware is fixed to the starter ramp.
    rounded(109, 26, 16, 14, 4, "#e2d2f4", "#6e5289", 1.4);
    hardware(117, 33, 3.1, "#f8ecff", "#6e5289");
  }

  function bake(machine) {
    backdrop.width = WIDTH * 2;
    backdrop.height = HEIGHT * 2;
    ctx = backdrop.getContext("2d");
    ctx.scale(2, 2);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    paper();
    drawScaffolding(machine);
    ctx = board;
    paintedMachine = machine;
  }

  function track({ x1, y1, x2, y2, kind, thickness }) {
    const paint = PAINT[kind];
    const width = Math.hypot(x2 - x1, y2 - y1);
    ctx.save();
    ctx.translate(x1, y1);
    ctx.rotate(Math.atan2(y2 - y1, x2 - x1));
    rounded(1, 3, width, thickness + 2, 3, "#503a4521");
    rounded(0, 0, width, thickness, 3, paint.mid, paint.edge);
    rounded(1.5, 0.8, width - 3, 3.2, 1.4, paint.light);
    line([[3, thickness - 2], [width - 3, thickness - 2]], paint.shade, 1.6);
    hardware(8, 7.4, 2.4, paint.light, paint.edge);
    if (width > 34) hardware(width - 8, 7.4, 2.4, paint.light, paint.edge);

    if (kind !== "wood" && kind !== "spring" && width > 70) {
      const direction = kind === "teal" ? -1 : 1;
      for (let x = width / 4; x < width - 24; x += width / 4) {
        line([[x - direction * 3.5, 4.4], [x, 7.0], [x - direction * 3.5, 9.5]], paint.edge, 1.3);
      }
    }
    ctx.restore();
  }

  function bodyBox(body, w, h, radius, kind, bolt = true) {
    const paint = PAINT[kind];
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.rotate(body.angle);
    rounded(-w / 2 + 2, -h / 2 + 2.7, w, h, radius, "#41385029");
    rounded(-w / 2, -h / 2, w, h, radius, paint.mid, paint.edge);
    if (w >= 7 && h >= 10) {
      rounded(-w / 2 + 1.2, -h / 2 + 2.4, Math.max(w * 0.28, 1), h - 5, 2, paint.top);
    }
    if (bolt) hardware(0, 0, Math.min(w / 5, 3.7), paint.light, paint.edge);
    ctx.restore();
  }

  function drawRelease(machine) {
    bodyBox(machine.releaseWall, 12, 49, 4, "violet");
    if (!machine.started) {
      bodyBox(machine.releasePin, 11, 36, 4, "yellow", false);
      const { x, y } = machine.releasePin.position;
      disk(x + 3.9, y - 19, 8.0, "#ffca71", "#986437", 1.6);
      disk(x + 3.9, y - 19, 3.45, "#fff3d6", "#986437", 1.3);
    }
  }

  function drawDominoes(machine) {
    const tilePaint = ["coral", "yellow", "teal", "violet"];
    for (let index = 0; index < machine.dominoes.length; index += 1) {
      const tile = machine.dominoes[index];
      bodyBox(machine.dominoStops[index], 5, 10, 2, "wood", false);
      bodyBox(tile, 10, 48, 2.7, tilePaint[index % tilePaint.length], false);
      ctx.save();
      ctx.translate(tile.position.x, tile.position.y);
      ctx.rotate(tile.angle);
      disk(0, -13, 2.2, "#fff9ea", PAINT[tilePaint[index % tilePaint.length]].edge, 0.65);
      disk(0, -6, 1.5, "#fff9ea");
      ctx.restore();
      hardware(381 + index * 30, 142, 3.5, "#fff0cd", "#866650");
    }
  }

  function drawSeesaw(machine) {
    bodyBox(machine.dropWall, 13, 88, 4, "coral");
    ctx.save();
    ctx.translate(machine.dropWall.position.x, machine.dropWall.position.y);
    for (const y of [-25, -15, 15, 25]) line([[-4.5, y + 3], [4.5, y - 3]], "#ffdebe", 2.8);
    ctx.restore();
    bodyBox(machine.topStop, 28, 12, 3, "steel");
    bodyBox(machine.bottomStop, 38, 15, 3, "steel");
    bodyBox(machine.returnStop, 10, 20, 3, "teal", false);

    const [, beam, counterweight, catchLeft, catchRight, cuff, toe] = machine.seesaw.parts;
    bodyBox(beam, 276, 14, 4, "wood", false);
    bodyBox(counterweight, 39, 22, 5, "steel");
    bodyBox(catchLeft, 11, 38, 3, "coral");
    bodyBox(catchRight, 12, 47, 3, "coral");
    bodyBox(cuff, 15, 56, 4, "coral", false);
    ctx.save();
    ctx.translate(toe.position.x, toe.position.y);
    ctx.rotate(toe.angle);
    path("M-17 6 Q-18 -2 -11 -3 L-5 -4 L-5 -10 Q3 -9 10 -12 L14 8 Q2 13 -14 11 Z",
      "#e67c62", "#874941", 1.9);
    path("M-17 6 Q-8 9 14 5 L14 9 Q-1 15 -15 11 Z", "#854755");
    path("M-12 0 Q-4 -3 0 -1 M2 -9 L6 3", null, "#ffd0a9", 2);
    ctx.restore();
    disk(machine.bootPivot.x, machine.bootPivot.y, 10, "#ffe6a6", "#745146", 1.8);
    hardware(machine.bootPivot.x, machine.bootPivot.y, 5, "#fff3ca", "#745146");
  }

  function drawWheel(machine) {
    const { x, y } = machine.wheelPivot;
    disk(x, y, 18, "#e8e0f1", "#b8a8c4", 1.5);
    ctx.save();
    ctx.translate(machine.wheel.position.x, machine.wheel.position.y);
    ctx.rotate(machine.wheel.angle);
    for (const name of ["violet", "yellow", "coral", "teal"]) {
      const paint = PAINT[name];
      rounded(4, -4.6, 36, 9.2, 4, "#b3a4c8", "#655475");
      rounded(27, -11, 18, 22, 5, paint.mid, paint.edge, 1.9);
      rounded(30, -8.5, 11, 4, 2, paint.top);
      hardware(36, 2, 2.7, paint.light, paint.edge);
      ctx.rotate(Math.PI / 2);
    }
    ctx.restore();
    disk(x, y, 13, "#e6d6f8", "#725a96", 1.8);
    hardware(x, y, 6, "#fff1ce", "#6f5686");
  }

  function drawCable(machine) {
    const { bucket, gate, bucketX, gateX, axleY, bucketHome } = machine.pulley;
    const radius = 14;
    const left = bucketX + radius;
    const right = gateX - radius;
    const bucketY = bucket.position.y;
    const gateY = gate.position.y;
    const lift = bucketY - bucketHome;
    for (const x of [left, right]) {
      disk(x + 1, axleY + 2.5, radius + 3, "#4c394933");
      disk(x, axleY, radius + 2, "#a88c66", "#66523d", 1.4);
      disk(x, axleY, radius - 2.6, "#ead1a0", "#8f7253", 1.3);
      ctx.save();
      ctx.translate(x, axleY);

  function drawStageTags(triggered, active, now) {
    for (let i = 0; i < STAGES.length; i += 1) {
      const stage = STAGES[i];
      const [x, y] = stage.tag;
      const [tx, ty] = stage.tip;
      const paint = PAINT[stage.color];
      const lit = triggered.has(i + 1);
      const current = active === i + 1;
      ctx.font = '800 15px "DM Sans", sans-serif';
      const w = Math.ceil(ctx.measureText(stage.name).width + 47);
      const sx = Math.max(x + 15, Math.min(x + w - 14, tx));
      const sy = y + (ty > y + 15 ? 30 : 15);
      line([[sx, sy], [sx, sy + 9], [tx, ty]], lit ? paint.accent : "#92918f", 1.25, [3, 4]);
      disk(tx, ty, 2.4, lit ? paint.accent : "#aaa197");

      if (current) {
        const breathe = reducedMotion.matches ? 0.65 : 0.60 + Math.sin(now / 270) * 0.20;
        ctx.globalAlpha = breathe;
        rounded(x - 3, y - 3, w + 6, 36, 13, paint.top);
        ctx.globalAlpha = 1;
      }
      rounded(x + 1.1, y + 2.5, w, 30, 9, "#39304714");
      rounded(x, y, w, 30, 9, current ? paint.light : "#fffdf6", lit ? paint.accent : "#c0b7ac", current ? 1.5 : 1.05);
      disk(x + 15, y + 15, 9.8, current ? paint.edge : paint.top, lit ? paint.accent : paint.edge, 0.65);
      label(String(i + 1), x + 15, y + 15.2, '850 12px "DM Sans", sans-serif', current ? "#fff" : INK, "center");
      label(stage.name, x + 31, y + 15.7, '800 15px "DM Sans", sans-serif');
    }
  }

  function celebrate() {
    // Paper uses ballistic flight with air drag and a fixed seed for repeatable bursts.
    let seed = 8092;
    const random = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const colors = ["#785cd7", "#e97e71", "#f2b741", "#56a894", "#c28dda", "#f1af8e"];
    particles = [];
    festoon = [];
    for (let i = 0; i < 178; i += 1) {
      const x = [100, 381, 695, 1015, 1205][i % 5];
      const y = [417, 293, 404, 379, 504][i % 5];
      const direction = (x < 640 ? 1 : -1) * (random() * 1.65 + 0.2);
      const color = colors[i % colors.length];
      particles.push({
        x, y, color,
        vx: direction * (85 + random() * 240),
        vy: -245 - random() * 360,
        rotation: random() * TAU,
        spin: (random() - 0.5) * 11,
        life: 1.9 + random() * 1.7,
        delay: random() * 0.52,
        w: 3 + random() * 7,
        h: 2.6 + random() * 4.5
      });
      if (i < 35) festoon.push({
        x: 28 + random() * 1224,
        y: 9 + random() * 570,
        angle: random() * TAU,
        color
      });
    }
  }

  function drawCelebration(age, dt) {
    const alpha = Math.min(1, age * 3.2);
    for (const item of festoon) {
      ctx.save();
      ctx.globalAlpha = alpha * 0.69;
      ctx.translate(item.x, item.y);
      ctx.rotate(item.angle);
      rounded(-2.6, -1.4, 5.2, 2.8, 1, item.color);
      ctx.restore();
    }
    if (!reducedMotion.matches) {
      for (const p of particles) {
        if (age < p.delay || age - p.delay >= p.life) continue;
        p.vx *= Math.exp(-0.63 * dt);
        p.vy += dt * (345 - 0.42 * p.vy);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rotation += p.spin * dt;
        ctx.save();
        ctx.globalAlpha = Math.min(1, (p.life - age + p.delay) * 2.5);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        rounded(-p.w / 2, -p.h / 2, p.w, p.h, 1.2, p.color);
        ctx.restore();
      }
    }
    glint(1003, 399, 11, "#e5ae54");
    glint(1225, 391, 8, "#a16acc");
    glint(1190, 345, 9, "#dd836e");
    glint(1052, 349, 8, "#95b888");
    glint(1250, 428, 9, "#e5ae54");
    if (age < 2.9 || reducedMotion.matches) {
      ctx.save();
      ctx.globalAlpha = reducedMotion.matches ? 1 : Math.min(1, (2.9 - age) * 1.6);
      ctx.translate(975, 438);
      ctx.rotate(-0.14);
      path("M-12 21 L2 12 L-14 8 Z", "#fff3b5", "#8e6437", 1.4);
      rounded(-33, -15, 66, 31, 9, "#fff3b5", "#8e6437", 1.5);
      label("DING!", 0, 1.5, '850 18px "Bricolage Grotesque", sans-serif', "#8a5237", "center");
      ctx.restore();
      path("M951 496 Q961 483 951 471 M961 503 Q977 482 964 466", null, "#bd834b", 2.4);
    }
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    viewportWidth = rect.width;
    viewportHeight = rect.height;
    pixelRatio = Math.min(2.5, window.devicePixelRatio || 1);
  }

  function setCamera(machine, active, awake, stageAge, dt) {
    const fit = Math.min(viewportWidth / WIDTH, viewportHeight / HEIGHT);
    const following = smallScreen.matches && machine.started && !reducedMotion.matches;
    const close = Math.min(viewportWidth / 513, viewportHeight / 335);
    const smooth = 1 - Math.exp(-dt * 5.7);
    zoom += ((following ? 1 : 0) - zoom) * smooth;
    const scale = fit + (Math.max(fit, close) - fit) * zoom;

    let aim = { x: WIDTH / 2, y: HEIGHT / 2 };
    if (following) {
      if (awake) aim = { x: 1105, y: 468 };
      else if (active === 1) aim = machine.starter.position;
      else if (active === 2) aim = { x: 497, y: 126 };
      else if (active === 3) aim = machine.freight.position;
      else if (active <= 6) aim = machine.returnBall.position;
      else if (active === 7) aim = stageAge < 0.5 ? { x: 277, y: 466 } : machine.alarmBall.position;
      else aim = { x: 927, y: 490 };
    }
    cameraX += (aim.x - cameraX) * smooth;
    cameraY += (aim.y - cameraY) * smooth;
    const halfW = Math.min(WIDTH / 2, viewportWidth / (2 * scale));
    const halfH = Math.min(HEIGHT / 2, viewportHeight / (2 * scale));
    const cx = Math.max(halfW, Math.min(WIDTH - halfW, cameraX));
    const cy = Math.max(halfH, Math.min(HEIGHT - halfH, cameraY));
    ctx.translate(viewportWidth / 2 - cx * scale, viewportHeight / 2 - cy * scale);
    ctx.scale(scale, scale);
  }

  function draw(machine, triggered, active, winAge, stageAge, now, dt) {
    const width = Math.max(1, Math.round(viewportWidth * pixelRatio));
    const height = Math.max(1, Math.round(viewportHeight * pixelRatio));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    if (paintedMachine !== machine) bake(machine);
    const awake = winAge >= 0;
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.fillStyle = "#f7f3eb";
    ctx.fillRect(0, 0, viewportWidth, viewportHeight);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    setCamera(machine, active, awake, stageAge, dt);
    ctx.drawImage(backdrop, 0, 0, WIDTH, HEIGHT);
    drawNook(awake);
    drawCable(machine);
    for (const rail of machine.tracks) track(rail);
    drawRelease(machine);
    drawDominoes(machine);
    drawSeesaw(machine);
    drawWheel(machine);
    drawBucketAndGate(machine);
    drawPendulumAndBell(machine);
    const movingMarble = [
      null, machine.starter, null, machine.freight, machine.returnBall, machine.returnBall,
      machine.returnBall, machine.alarmBall, machine.clapper, null
    ][active];
    for (const marble of machine.marbles) drawMarble(marble, marble.body === movingMarble);
    drawHamster(awake, winAge, now);
    drawStageTags(triggered, active, now);
    if (awake) drawCelebration(winAge, dt);
  }

  function reset() {
    zoom = 0;
    cameraX = WIDTH / 2;
    cameraY = HEIGHT / 2;
    particles = [];
    festoon = [];
  }

  return { draw, resize, celebrate, reset };
}

function createSound() {
  let audio;
  let bus;
  let enabled = true;

  function quiet() {
    if (!audio) return;
    bus?.disconnect();
    bus = audio.createGain();
    bus.gain.value = 0.7;
    bus.connect(audio.destination);
  }

  function unlock() {
    if (!enabled) return;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      if (!audio) {
        audio = new Audio();
        quiet();
      }
      if (audio.state === "suspended") audio.resume().catch(() => {});
    } catch {
      // The exhibit remains playable when Web Audio is unavailable.
    }
  }

  function tone(from, to, duration, volume, delay = 0, type = "sine") {
    if (!enabled || !audio || !bus) return;
    const begin = audio.currentTime + delay;
    const oscillator = audio.createOscillator();
    const envelope = audio.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(from, begin);
    oscillator.frequency.exponentialRampToValueAtTime(to, begin + duration);
    envelope.gain.setValueAtTime(0.0001, begin);
    envelope.gain.linearRampToValueAtTime(volume, begin + 0.008);
    envelope.gain.exponentialRampToValueAtTime(0.0001, begin + duration);
    oscillator.connect(envelope);
    envelope.connect(bus);
    oscillator.start(begin);
    oscillator.stop(begin + duration + 0.015);
    oscillator.onended = () => {
      oscillator.disconnect();
      envelope.disconnect();
    };
  }

  function effect(name) {
    if (!enabled) return;
    switch (name) {
      case "pin":
        tone(650, 480, 0.10, 0.09, 0, "triangle");
        tone(320, 215, 0.12, 0.045, 0.052, "triangle");
        break;
      case "tile":
        tone(398, 161, 0.067, 0.085, 0, "triangle");
        tone(740, 477, 0.035, 0.028);
        break;
      case "freight":
        tone(188, 120, 0.28, 0.06, 0, "triangle");
        break;
      case "boot":
        tone(163, 71, 0.23, 0.16, 0, "triangle");
        tone(580, 261, 0.13, 0.07, 0.09);
        break;
      case "wheel":
        tone(540, 370, 0.105, 0.07, 0, "triangle");
        tone(740, 479, 0.095, 0.05, 0.08, "triangle");
        tone(855, 569, 0.09, 0.035, 0.162, "triangle");
        break;
      case "spring":
        tone(420, 204, 0.16, 0.115, 0, "triangle");
        tone(203, 584, 0.22, 0.085, 0.02);
        break;
      case "pulley":
        tone(355, 119, 0.17, 0.10, 0, "triangle");
        tone(815, 526, 0.13, 0.067, 0.21);
        break;
      case "strike":
        tone(280, 102, 0.15, 0.095, 0, "triangle");
        break;
      case "bell":
        tone(783.99, 783.99, 2.25, 0.22);
        tone(1571, 1570, 1.48, 0.118);
        tone(2132, 2129, 0.76, 0.075);
        tone(3164, 3160, 0.55, 0.044);
        tone(4470, 4450, 0.25, 0.025);
        tone(587.33, 587.33, 0.56, 0.09, 0.30, "triangle");
        tone(698.46, 698.46, 0.5, 0.08, 0.44, "triangle");
        tone(1046.5, 1046.5, 0.78, 0.092, 0.62, "triangle");
        break;
    }
  }

  return {
    unlock,
    effect,
    quiet,
    toggle() {
      enabled = !enabled;
      if (enabled) unlock();
      else quiet();
      return enabled;
    }
  };
}

const machineSection = document.getElementById("machine");
const startButton = document.getElementById("start");
const resetButton = document.getElementById("reset");
const soundButton = document.getElementById("sound");
const startLabel = document.getElementById("start-label");
const statusTitle = document.getElementById("status-title");
const statusDetail = document.getElementById("status-detail");
const countLabel = document.getElementById("stage-count");
const progress = document.getElementById("progress-steps");
const canvas = document.getElementById("board");
const scene = createScene(canvas);
const sound = createSound();
const stageSounds = ["pin", "tile", "freight", "boot", "wheel", "spring", "pulley", "strike", "bell"];
const bars = STAGES.map(stage => {
  const bar = document.createElement("span");
  bar.style.setProperty("--stage-color", PAINT[stage.color].accent);
  progress.append(bar);
  return bar;
});

let machine;
let active = 0;
let activeAt = 0;
let wakeAt = -1;
let wakeAge = -1;
let accumulator = 0;
let lastFrame = performance.now();
const triggered = new Set();

function updateReadout() {
  const complete = active === STAGES.length;
  machineSection.dataset.state = complete ? "complete" : active ? "running" : "ready";
  startButton.disabled = active > 0;
  startLabel.textContent = complete ? "Awake!" : active ? "Running" : "Start";
  statusTitle.textContent = complete ? "Pip is awake!" : active ? STAGES[active - 1].name : "Pip is asleep";
  statusDetail.textContent = active ? STAGES[active - 1].detail : "Press Start to release the first marble.";
  countLabel.textContent = `${triggered.size} / ${STAGES.length}`;
  progress.setAttribute("aria-valuenow", String(triggered.size));
  for (let i = 0; i < bars.length; i += 1) {
    bars[i].toggleAttribute("data-done", triggered.has(i + 1));
    if (i + 1 === active && !complete) bars[i].setAttribute("aria-current", "step");
    else bars[i].removeAttribute("aria-current");
  }
}

function onStage(number, time) {
  triggered.add(number);
  active = number;
  activeAt = time;
  sound.effect(stageSounds[number - 1]);
  if (number === STAGES.length) {
    wakeAt = time;
    wakeAge = 0;
    scene.celebrate();
  }
  updateReadout();
}

function reset() {
  triggered.clear();
  active = 0;
  activeAt = 0;
  wakeAt = -1;
  wakeAge = -1;
  accumulator = 0;
  machine = createMachine(onStage, sound.effect);
  sound.quiet();
  scene.reset();
  updateReadout();
  lastFrame = performance.now();
}

function frame(now) {
  const elapsed = Math.max(0, Math.min(83, now - lastFrame));
  lastFrame = now;
  if (machine.started && (wakeAt < 0 || machine.time < wakeAt + 3.2)) {
    accumulator += elapsed;
    while (accumulator >= STEP) {
      machine.step();
      accumulator -= STEP;
    }
  }
  if (wakeAge >= 0) wakeAge += elapsed / 1000;
  scene.draw(machine, triggered, active, wakeAge, machine.time - activeAt, now, elapsed / 1000);
  requestAnimationFrame(frame);
}

startButton.addEventListener("click", () => {
  sound.unlock();
  lastFrame = performance.now();
  machine.start();
});
resetButton.addEventListener("click", reset);
soundButton.addEventListener("click", () => {
  const on = sound.toggle();
  soundButton.setAttribute("aria-pressed", String(on));
  document.getElementById("sound-label").textContent = on ? "Sound on" : "Sound off";
});

drawBrand(document.getElementById("mark"));
scene.resize();
new ResizeObserver(scene.resize).observe(canvas);
reset();
requestAnimationFrame(frame);

  </script>
</body>
</html>
